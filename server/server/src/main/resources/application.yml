# =====================================================
# 华信通讯科技后端 应用配置
# =====================================================
server:
  # 后端服务端口
  port: 8080

spring:
  application:
    name: huaxin-server

  # 数据源（MySQL 8）
  # 生产环境通过环境变量 DB_USERNAME / DB_PASSWORD 覆盖；默认值仅供本地开发
  datasource:
    url: jdbc:mysql://localhost:3306/huaxin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis 配置
mybatis:
  # XML 映射文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包扫描（用于自动取别名）
  type-aliases-package: com.example.entity
  configuration:
    # 下划线列名 → 驼峰字段名 自动映射
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发期开启，生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 业务自定义配置
huaxin:
  # 上传文件存放目录（相对路径相对于后端启动工作目录 server/server/，对应仓库根的 upload/）
  # 也可在启动时用环境变量覆盖：HUAXIN_UPLOAD_DIR
  upload-dir: ${HUAXIN_UPLOAD_DIR:../../upload}
  # 上传文件对外访问的 URL 前缀（前端拼接用）
  upload-url-prefix: /upload
  # 后台管理硬编码账号（先期最简方案，后续接入数据库用户体系）
  # ⚠️ 生产环境必须通过环境变量覆盖；默认 changeme 仅用于本地启动占位
  admin:
    username: ${HUAXIN_ADMIN_USERNAME:admin}
    password: ${HUAXIN_ADMIN_PASSWORD:changeme}
    # 登录后返回的固定 token；前端把它放在请求头 X-Auth-Token
    token: ${HUAXIN_ADMIN_TOKEN:please-change-me}
