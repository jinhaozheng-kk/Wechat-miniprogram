# 生产环境配置：通过 `--spring.profiles.active=prod` 启用
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:${MYSQL_ADDRESS:127.0.0.1:3306}}/${DB_NAME:${MYSQL_DATABASE:springboot_demo}}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:${MYSQL_USERNAME:root}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/schema-cloud.sql

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

huaxin:
  upload-dir: ${HUAXIN_UPLOAD_DIR:/tmp/huaxin-upload}
  upload-url-prefix: /upload
  admin:
    username: ${HUAXIN_ADMIN_USERNAME:admin}
    password: ${HUAXIN_ADMIN_PASSWORD:admin123}
    token: ${HUAXIN_ADMIN_TOKEN:huaxin-admin-token-2026}
